<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Post Discord</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.0/dist/sweetalert2.min.css">
    <style>
        :root{
            --bg:#313338;
            --bg-2:#2b2d31;
            --card:#1e1f22;
            --border:#3f4147;
            --text:#dbdee1;
            --muted:#949ba4;
            --accent:#5865f2;
            --accent-hover:#4752c4;
            --danger:#da373c;
            --success:#57f39c;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        html,body{height:100%}
        body{
            font-family:'Inter',system-ui,-apple-system,sans-serif;
            background:
                radial-gradient(1200px 600px at 80% -10%, rgba(88,101,242,.18), transparent 60%),
                radial-gradient(900px 500px at -10% 110%, rgba(88,101,242,.12), transparent 55%),
                var(--bg);
            color:var(--text);
            min-height:100%;
            display:flex;align-items:center;justify-content:center;
            padding:1.5rem;
        }
        .shell{width:100%;max-width:400px}
        .brand{display:flex;align-items:center;justify-content:center;gap:.6rem;margin-bottom:1.5rem}
        .brand .logo{
            width:44px;height:44px;border-radius:14px;
            background:linear-gradient(135deg,var(--accent),#7983f5);
            display:flex;align-items:center;justify-content:center;
            box-shadow:0 8px 24px rgba(88,101,242,.35);
        }
        .brand h1{font-size:1.2rem;font-weight:700;letter-spacing:.2px}
        .card{
            background:rgba(30,31,34,.75);
            border:1px solid var(--border);
            border-radius:16px;
            padding:1.6rem;
            backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
            box-shadow:0 20px 50px rgba(0,0,0,.45);
            animation:fadeUp .35s ease;
        }
        @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .card h2{font-size:1.05rem;font-weight:600;margin-bottom:.35rem}
        .card .sub{color:var(--muted);font-size:.85rem;margin-bottom:1.25rem;line-height:1.5}
        label{display:block;font-size:.8rem;font-weight:500;color:var(--muted);margin-bottom:.4rem}
        .field{position:relative;margin-bottom:1rem}
        .field .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px;pointer-events:none}
        .input{
            width:100%;padding:.7rem .9rem .7rem 2.4rem;
            background:var(--bg-2);border:1px solid var(--border);border-radius:10px;
            color:var(--text);font-size:.9rem;font-family:inherit;
            transition:border-color .15s,box-shadow .15s;
        }
        .input:focus{outline:none;border-color:var(--accent);background:var(--card);box-shadow:0 0 0 3px rgba(88,101,242,.25)}
        .input.is-invalid{border-color:var(--danger);box-shadow:0 0 0 3px rgba(218,55,62,.25)}
        .btn{
            width:100%;padding:.7rem 1rem;border:none;border-radius:10px;
            background:var(--accent);color:#fff;font-size:.92rem;font-weight:600;font-family:inherit;
            cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.5rem;
            transition:background .15s,transform .05s;
        }
        .btn:hover{background:var(--accent-hover)}
        .btn:active{transform:translateY(1px)}
        .btn svg{width:18px;height:18px}
        .foot{margin-top:1rem;text-align:center;color:var(--muted);font-size:.78rem}
        .foot a{color:var(--accent);text-decoration:none}
        .foot a:hover{text-decoration:underline}
    </style>
</head>
<body>
    <div class="shell">
        <div class="brand">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="currentColor" width="26" height="26" aria-hidden="true">
                    <path d="M20.317 4.369a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.249a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.036A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.009c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.029ZM8.02 15.331c-1.182 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418Zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418Z"/>
                </svg>
            </div>
            <h1>Auto Post Discord</h1>
        </div>
        <div class="card">
            <h2>Login</h2>
            <p class="sub">Masuk dengan password untuk mengakses halaman setup bot.</p>
            <div class="field">
                <span class="icon"><i data-lucide="lock"></i></span>
                <input type="password" id="pass" class="input" placeholder="Password" autocomplete="off">
            </div>
            <button id="loginBtn" class="btn"><i data-lucide="arrow-right"></i> Masuk</button>
        </div>
        <p class="foot">Butuh bantuan? <a href="https://discord.gg/FKKUAsFWMt">Join Discord</a></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.0/dist/sweetalert2.all.min.js"></script>
    <script>
        function safeIcons(){ if (typeof lucide !== 'undefined') lucide.createIcons(); }
        document.addEventListener('DOMContentLoaded', () => {
            safeIcons();
            const passInput = document.getElementById('pass');
            const loginBtn = document.getElementById('loginBtn');

            const notify = (type, title, text='') => {
                if (typeof Swal !== 'undefined') Swal.fire({ icon:type, title, text, background:'#1e1f22', color:'#dbdee1', confirmButtonColor: type==='error'?'#da373c':'#5865f2' });
                else alert(`${type.toUpperCase()}: ${title} ${text}`);
            };

            passInput.addEventListener('input', () => passInput.classList.remove('is-invalid'));

            loginBtn.addEventListener('click', () => {
                const val = passInput.value.trim();
                if (!val) {
                    passInput.classList.add('is-invalid');
                    return notify('error', 'Password kosong', 'Masukkan password terlebih dahulu.');
                }
                if (val !== 'outcast') {
                    passInput.classList.add('is-invalid');
                    return notify('error', 'Password salah', 'Password yang benar: outcast');
                }
                try { localStorage.setItem('apd_logged', '1'); } catch(e){}
                window.location.href = '/setup';
            });

            passInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') loginBtn.click(); });
        });
    </script>
</body>
</html>
