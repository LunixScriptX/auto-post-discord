<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Post Discord — Setup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.0/dist/sweetalert2.min.css">
    <style>
        :root{
            --bg:#313338;
            --bg-2:#2b2d31;
            --card:#1e1f22;
            --card-2:#2b2d31;
            --border:#3f4147;
            --text:#dbdee1;
            --muted:#949ba4;
            --accent:#5865f2;
            --accent-hover:#4752c4;
            --success:#57f39c;
            --danger:#da373c;
            --warn:#f5a623;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        body{
            font-family:'Inter',system-ui,-apple-system,sans-serif;
            background:
                radial-gradient(1200px 600px at 80% -10%, rgba(88,101,242,.12), transparent 60%),
                radial-gradient(900px 500px at -10% 110%, rgba(88,101,242,.08), transparent 55%),
                var(--bg);
            color:var(--text);
            min-height:100vh;
            padding:1.5rem;
        }
        .container{max-width:1000px;margin:0 auto}
        header{
            display:flex;align-items:center;justify-content:space-between;
            margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem;
        }
        header h1{
            font-size:1.25rem;font-weight:700;
            display:flex;align-items:center;gap:.6rem;
        }
        header h1 .logo{width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#7983f5);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(88,101,242,.35)}
        header h1 .logo svg{width:20px;height:20px;color:#fff}
        .status-badge{
            display:inline-flex;align-items:center;gap:.4rem;
            padding:.35rem .8rem;border-radius:20px;font-size:.8rem;font-weight:600;
        }
        .status-running{background:rgba(87,243,156,.12);color:var(--success);border:1px solid var(--success)}
        .status-stopped{background:rgba(148,155,164,.1);color:var(--muted);border:1px solid var(--border)}
        .card{
            background:var(--card);border:1px solid var(--border);
            border-radius:14px;padding:1.25rem;margin-bottom:1.25rem;
            animation:fadeUp .3s ease;
        }
        @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        .card h2,.card h3{font-weight:600;margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem}
        .card h2{font-size:1.1rem}
        .card h3{font-size:.95rem}
        .card h3 svg{width:18px;height:18px;color:var(--accent)}
        .card .sub{color:var(--muted);font-size:.82rem;line-height:1.5}
        label{font-size:.8rem;font-weight:500;color:var(--muted);margin-bottom:.3rem;display:block}
        .form-row{display:flex;gap:.75rem;flex-wrap:wrap}
        .form-row > div{flex:1;min-width:160px}
        .input,select{
            width:100%;padding:.6rem .8rem;border:1px solid var(--border);
            border-radius:8px;background:var(--bg-2);color:var(--text);
            font-size:.87rem;font-family:inherit;transition:border-color .15s,box-shadow .15s;
        }
        .input:focus,select:focus{outline:none;border-color:var(--accent);background:var(--card);box-shadow:0 0 0 3px rgba(88,101,242,.2)}
        .input.is-invalid{border-color:var(--danger);box-shadow:0 0 0 3px rgba(218,55,62,.25)}
        textarea.input{width:100%;min-height:70px;resize:vertical;font-family:inherit}
        .btn{
            display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
            padding:.6rem 1.1rem;border:none;border-radius:8px;font-size:.85rem;
            font-weight:600;cursor:pointer;transition:all .15s;user-select:none;
        }
        .btn:active{transform:scale(.96)}
        .btn svg{width:16px;height:16px}
        .btn-primary{background:var(--accent);color:#fff}
        .btn-primary:hover{background:var(--accent-hover);box-shadow:0 4px 14px rgba(88,101,242,.35)}
        .btn-secondary{background:var(--card-2);color:var(--text);border:1px solid var(--border)}
        .btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
        .btn-danger{background:rgba(218,55,62,.12);color:#ff7875;border:1px solid #ff7875}
        .btn-danger:hover{background:rgba(218,55,62,.24)}
        .btn-toggle{background:var(--success);color:#0a0a12}
        .btn-toggle.active{background:var(--accent);color:#fff}
        .btn-toggle:hover{filter:brightness(1.05)}
        .toolbar{
            display:flex;justify-content:space-between;align-items:center;
            margin-bottom:.5rem;flex-wrap:wrap;gap:.5rem;
        }
        .toggle-wrapper{
            display:flex;align-items:center;gap:.5rem;cursor:pointer;user-select:none;
        }
        .switch{
            position:relative;display:inline-flex;align-items:center;
            width:46px;height:26px;background:var(--border);border-radius:999px;
            cursor:pointer;transition:background .25s;
        }
        .switch.on{background:var(--accent)}
        .switch .knob{
            position:absolute;top:3px;left:3px;width:20px;height:20px;
            border-radius:50%;background:#fff;
            transition:transform .25s cubic-bezier(.4,0,.2,1);
            box-shadow:0 1px 3px rgba(0,0,0,.3);
        }
        .switch.on .knob{transform:translateX(20px)}
        .table-wrap{border:1px solid var(--border);border-radius:8px;overflow:hidden}
        table{width:100%;border-collapse:collapse;font-size:.87rem}
        th,td{padding:.7rem .9rem;text-align:left;border-bottom:1px solid var(--border)}
        thead th{color:var(--muted);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.3px}
        tbody tr:hover{background:rgba(88,101,242,.06)}
        .check-cell{text-align:center}
        .chk{
            width:18px;height:18px;border:2px solid var(--border);
            border-radius:4px;cursor:pointer;display:inline-block;
            position:relative;top:0;left:0;transition:all .2s;
            background:var(--bg-2);
        }
        .chk.checked{
            border-color:var(--accent);
            background:var(--accent);
        }
        .chk.checked::after{
            content:'';
            position:absolute;top:1px;left:5px;
            width:5px;height:10px;
            border:solid #fff;border-width:0 2px 2px 0;
            transform:rotate(45deg);
        }
        .btn-icon{
            width:30px;height:30px;padding:0;border-radius:6px;
            border:1px solid var(--border);background:transparent;
            color:var(--muted);cursor:pointer;display:flex;
            align-items:center;justify-content:center;
            transition:all .15s;
        }
        .btn-icon:active{transform:scale(.85)}
        .btn-icon:hover{border-color:var(--accent);color:var(--accent);background:rgba(88,101,242,.1)}
        .btn-icon.danger:hover{border-color:var(--danger);color:var(--danger);background:rgba(218,55,62,.1)}
        .badge{display:inline-flex;align-items:center;gap:.25rem;padding:.2rem .55rem;border-radius:6px;font-size:.72rem;font-weight:600}
        .badge-on{background:rgba(88,101,242,.15);color:var(--accent)}
        .badge-off{background:rgba(148,155,164,.1);color:var(--muted);border:1px solid var(--border)}
        .logs-card{max-height:340px;overflow-y:auto}
        .log-row{
            display:flex;align-items:center;gap:.6rem;
            padding:.5rem .7rem;border-bottom:1px solid var(--border);
            font-size:.8rem;animation:fadeUp .2s ease;
        }
        .log-row:last-child{border-bottom:none}
        .log-status{width:9px;height:9px;border-radius:50%;flex-shrink:0}
        .dot-success{background:var(--success)}
        .dot-error{background:var(--danger)}
        .dot-pending{background:var(--warn)}
        .log-msg{flex:1;word-break:break-word;color:var(--muted)}
        .log-meta{color:var(--muted);font-size:.72rem}
        .badge-log{padding:.15rem .5rem;font-size:.7rem}
        .empty-state{color:var(--muted);text-align:center;padding:1.25rem;font-size:.82rem}
        .empty-state svg{width:36px;height:36px;margin-bottom:.5rem;color:var(--border)}
        .toast-custom{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--accent)}
        @media(max-width:768px){.container{padding:0 .3rem}.form-row > div{flex:1 1 100%}}
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1><span class="logo"><i data-lucide="send"></i></span> Auto Post Discord — Setup</h1>
        <span id="statusBadge" class="status-badge status-stopped">
            <span style="width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block"></span>
            Stopped
        </span>
    </header>

    <!-- Form Setup -->
    <div class="card">
        <h2><i data-lucide="settings-2"></i> Setup Bot</h2>
        <p class="sub">Masukkan auth token Discord beserta pesan, channel, dan delay. Config tersimpan per token.</p>

        <div class="form-row" style="margin-bottom:.75rem">
            <div>
                <label>Auth Token Discord</label>
                <input type="password" id="authToken" class="input" placeholder="token...">
                <div class="hint" style="color:var(--muted);font-size:.72rem;margin-top:.2rem">Dapatkan via browser extension / inspect element.</div>
            </div>
            <div>
                <label>Pesan</label>
                <input id="message" class="input" placeholder="Pesan oto post">
            </div>
        </div>
        <div class="form-row">
            <div>
                <label>Channel ID</label>
                <input id="channelID" class="input" type="number" placeholder="id channel">
            </div>
            <div>
                <label>Delay (ms)</label>
                <input id="delay" class="input" type="number" min="5" placeholder="min 5ms">
            </div>
        </div>
        <div style="margin-top:.9rem;display:flex;gap:.6rem">
            <button id="addConfigBtn" class="btn btn-secondary"><i data-lucide="plus"></i> Save Config</button>
            <button id="toggleAllConfigs" class="btn btn-secondary"><i data-lucide-layers></i> Pilih Semua</button>
        </div>
    </div>

    <!-- Config List -->
    <div class="card">
        <div class="toolbar">
            <h3><i data-lucide="layers"></i> Config List</h3>
            <span class="badge badge-on" id="configCount">0 selected</span>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th style="width:50px"></th>
                        <th>Pesan</th>
                        <th style="width:130px">Channel ID</th>
                        <th style="width:90px">Delay (ms)</th>
                        <th style="width:80px">Status</th>
                        <th style="width:95px">Aksi</th>
                    </tr>
                </thead>
                <tbody id="configTableBody"></tbody>
            </table>
        </div>
        <div style="margin-top:.7rem">
            <button id="toggleBtn" class="btn btn-toggle"><i data-lucide="play"></i> Start Selected (<span id="selectedCount">0</span>)</button>
        </div>
    </div>

    <!-- Logs -->
    <div class="card logs-card">
        <div class="toolbar">
            <h3><i data-lucide="clipboard-list"></i> Realtime Logs</h3>
            <button id="clearLogsBtn" class="btn btn-secondary btn-sm"><i data-lucide="trash-2"></i> Clear</button>
        </div>
        <div id="logTableBody">
            <div class="empty-state"><i data-lucide="terminal"></i><div>Belum ada log.</div></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.0/dist/sweetalert2.all.min.js"></script>
<script>
    function safeIcons(){ if (typeof lucide !== 'undefined') lucide.createIcons(); }

    document.addEventListener('DOMContentLoaded', () => {
        let botConfigs = [];
        let activeConfigs = [];
        let postInterval = null;
        let token = '';

        // Toast: hanya pakai Swal bila tersedia, fallback alert
        const showToast = (typeof Swal !== 'undefined') ? Swal.mixin({
            toast: true, position: 'top-end', showConfirmButton: false,
            timer: 2200, timerProgressBar: true,
            background: '#1e1f22', color: '#dbdee1', iconColor: '#5865f2',
            customClass: { popup: 'toast-custom' },
            didOpen: (t)=>{ t.onmouseenter=Swal.stopTimer; t.onmouseleave=Swal.resumeTimer; }
        }) : { fire: (o)=>alert(`${o.title||''} ${o.text||''}`) };

        const notify = (type, title, html='') => {
            if (typeof Swal !== 'undefined') Swal.fire({
                icon:type, title, html, background:'#1e1f22', color:'#dbdee1',
                confirmButtonColor: type==='error'?'#da373c':'#5865f2'
            }); else alert(`${type.toUpperCase()}: ${title}`);
        };

        const confirmAction = (title, text, onYes) => {
            if (typeof Swal !== 'undefined') {
                Swal.fire({ title, text, icon:'warning', showCancelButton:true, confirmButtonColor:'#5865f2',
                    cancelButtonColor:'#d33', confirmButtonText:'Ya', background:'#1e1f22', color:'#dbdee1'
                }).then(r => { if (r.isConfirmed) onYes(); });
            } else if (confirm(`${title}\n${text}`)) onYes();
        };

        function truncate(t,n){ return t&&t.length<=n ? t : (t||'').substring(0,n-3)+'...'; }

        // ===== Render table via DOM (listeners persist) =====
        function renderTable() {
            const tbody = document.getElementById('configTableBody');
            tbody.innerHTML = '';
            if (botConfigs.length === 0) {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td colspan="6"><div class="empty-state"><i data-lucide="inbox"></i><div>Belum ada config. Tambahkan di atas.</div></div></td>`;
                tbody.appendChild(tr);
                safeIcons(); return;
            }
            const frag = document.createDocumentFragment();
            botConfigs.forEach((cfg, i) => {
                const tr = document.createElement('tr');

                // checkbox
                const tdC = document.createElement('td');
                tdC.className = 'check-cell';
                const chk = document.createElement('span');
                chk.className = 'chk' + (cfg.selected ? ' checked' : '');
                chk.dataset.idx = i;
                chk.addEventListener('click', (e) => {
                    e.stopPropagation();
                    cfg.selected = !cfg.selected;
                    chk.className = 'chk' + (cfg.selected ? ' checked' : '');
                    syncActive();
                    updateSelectedCount();
                });
                tdC.appendChild(chk);
                tr.appendChild(tdC);

                const tdMsg = document.createElement('td');
                tdMsg.title = cfg.message;
                tdMsg.textContent = truncate(cfg.message, 30);
                tr.appendChild(tdMsg);

                const tdCh = document.createElement('td');
                tdCh.textContent = cfg.channelID;
                tr.appendChild(tdCh);

                const tdDelay = document.createElement('td');
                tdDelay.textContent = cfg.delay;
                tr.appendChild(tdDelay);

                const tdStatus = document.createElement('td');
                tdStatus.innerHTML = cfg.active
                    ? `<span class="badge badge-on">On</span>`
                    : `<span class="badge badge-off">Off</span>`;
                tr.appendChild(tdStatus);

                const tdAct = document.createElement('td');
                const editBtn = document.createElement('button');
                editBtn.className = 'btn-icon'; editBtn.title = 'Edit';
                editBtn.innerHTML = '<i data-lucide="edit-2"></i>';
                editBtn.addEventListener('click', () => editConfig(i));
                const delBtn = document.createElement('button');
                delBtn.className = 'btn-icon danger'; delBtn.title = 'Hapus';
                delBtn.innerHTML = '<i data-lucide="trash-2"></i>';
                delBtn.addEventListener('click', () => deleteConfig(i));
                tdAct.append(editBtn, delBtn);
                tr.appendChild(tdAct);

                frag.appendChild(tr);
            });
            tbody.appendChild(frag);
            safeIcons();
        }

        function syncActive() {
            activeConfigs = botConfigs.filter(c => c.selected && c.active);
        }

        function updateSelectedCount() {
            document.getElementById('selectedCount').textContent = activeConfigs.length;
            document.getElementById('configCount').textContent = activeConfigs.length + ' selected';
            document.getElementById('configCount').className = activeConfigs.length > 0 ? 'badge badge-on' : 'badge badge-off';
        }

        // ===== Save configs (to server db.json via token) =====
        function saveConfigs() {
            fetch('/save-configs', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, configs: botConfigs })
            }).catch(e => console.error('save configs error', e));
        }

        // ===== Load configs =====
        async function loadConfigs() {
            if (!token) return;
            try {
                const res = await fetch(`/load-configs?token=${encodeURIComponent(token)}`);
                const data = await res.json();
                if (data.success) {
                    botConfigs = Array.isArray(data.configs) ? data.configs : [];
                    syncActive();
                    renderTable();
                    updateSelectedCount();
                }
            } catch(e) { console.error('Load error:', e); }
        }

        // ===== Add config =====
        document.getElementById('addConfigBtn').addEventListener('click', async () => {
            const t = document.getElementById('authToken').value.trim();
            const m = document.getElementById('message').value.trim();
            const c = document.getElementById('channelID').value.trim();
            const d = document.getElementById('delay').value.trim();

            if (!t || !m || !c || !d) {
                return notify('error', 'Validasi Gagal', 'Isi semua field (token, message, channel, delay).');
            }
            if (parseInt(d) < 5) {
                return notify('error', 'Delay minimal 5ms');
            }

            const cfg = { message:m, channelID:parseInt(c), delay:parseInt(d), selected:true, active:true };
            botConfigs.push(cfg);
            token = t;
            syncActive();
            saveConfigs();
            renderTable();
            updateSelectedCount();
            // clear inputs
            document.getElementById('message').value = '';
            document.getElementById('channelID').value = '';
            document.getElementById('delay').value = '';
            showToast.fire({ icon:'success', title:'Config disimpan' });
        });

        // ===== Select all toggle =====
        document.getElementById('toggleAllConfigs').addEventListener('click', () => {
            const allSelected = activeConfigs.length === botConfigs.length;
            botConfigs.forEach(c => c.selected = allSelected ? false : true);
            syncActive();
            renderTable();
            updateSelectedCount();
            showToast.fire({ icon:'info', title: allSelected ? 'Deselect all' : 'Select all' });
        });

        // ===== Edit config =====
        async function editConfig(i) {
            const cfg = botConfigs[i];
            const r = await Swal.fire({
                title:'Edit Config', background:'#1e1f22', color:'#dbdee1',
                html:`
                    <input id="m" class="swal2-input" value="${cfg.message}" placeholder="Pesan">
                    <input id="c" class="swal2-input" value="${cfg.channelID}" placeholder="Channel ID" type="number">
                    <input id="d" class="swal2-input" value="${cfg.delay}" placeholder="Delay (ms)" type="number" min="5">
                `,
                focusConfirm:false, showCancelButton:true, confirmButtonText:'Simpan',
                preConfirm:() => {
                    const m=document.getElementById('m').value.trim();
                    const c=document.getElementById('c').value.trim();
                    const d=document.getElementById('d').value.trim();
                    if(!m||!c||!d){Swal.showValidationMessage('Isi semua field');return false;}
                    if(parseInt(d)<5){Swal.showValidationMessage('Delay minimal 5ms');return false;}
                    return {message:m, channelID:parseInt(c), delay:parseInt(d)};
                }
            });
            if (r.value) {
                botConfigs[i].message = r.value.message;
                botConfigs[i].channelID = r.value.channelID;
                botConfigs[i].delay = r.value.delay;
                syncActive();
                saveConfigs();
                renderTable();
                updateSelectedCount();
                showToast.fire({ icon:'success', title:'Diperbarui' });
            }
        }

        // ===== Delete config =====
        function deleteConfig(i) {
            confirmAction(
                'Hapus Config',
                'Yakin hapus config ini?',
                () => {
                    botConfigs.splice(i, 1);
                    syncActive();
                    saveConfigs();
                    renderTable();
                    updateSelectedCount();
                    showToast.fire({ icon:'success', title:'Dihapus' });
                }
            );
        }

        // ===== Start / Stop =====
        document.getElementById('toggleBtn').addEventListener('click', toggleAutoPost);

        function toggleAutoPost() {
            const btn = document.getElementById('toggleBtn');
            const badge = document.getElementById('statusBadge');
            const isStarted = postInterval === null;

            if (isStarted) {
                if (activeConfigs.length === 0) {
                    return notify('error', 'Pilih minimal 1 config dulu');
                }
                startAutoPost();
                btn.innerHTML = '<i data-lucide="pause"></i> Stop';
                btn.className = 'btn btn-danger';
                badge.innerHTML = '<span style="width:8px;height:8px;border-radius:50%;background:var(--success);display:inline-block"></span> Running';
                badge.className = 'status-badge status-running';
            } else {
                stopAutoPost();
                btn.innerHTML = '<i data-lucide="play"></i> Start Selected (<span id="selectedCount">0</span>)';
                btn.className = 'btn btn-toggle';
                badge.innerHTML = '<span style="width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block"></span> Stopped';
                badge.className = 'status-badge status-stopped';
            }
            safeIcons();
            showToast.fire({
                icon:'success',
                title: isStarted ? 'Bot berjalan' : 'Bot dihentikan'
            });
            saveAutoPostState(isStarted ? 'started' : 'stopped');
        }

        function startAutoPost() {
            if (activeConfigs.length === 0) return;
            let idx = 0;
            // Immediate first send
            sendNow(activeConfigs[idx]);
            idx = (idx + 1) % activeConfigs.length;
            postInterval = setInterval(() => {
                sendNow(activeConfigs[idx]);
                idx = (idx + 1) % activeConfigs.length;
            }, activeConfigs[0].delay);
        }

        function stopAutoPost() {
            clearInterval(postInterval);
            postInterval = null;
        }

        function saveAutoPostState(state) {
            fetch('/save-auto-post-state', {
                method:'POST', headers:{'Content-Type':'application/json'},
                body:JSON.stringify({ token, state })
            }).catch(() => {});
        }

        // ===== Send message to Discord =====
        function sendNow(cfg) {
            logMessage(cfg.message, cfg.channelID, 'sending');
            fetch(`https://discord.com/api/v10/channels/${cfg.channelID}/messages`, {
                method:'POST',
                headers:{'Authorization':token,'Content-Type':'application/json'},
                body:JSON.stringify({content:cfg.message})
            }).then(r => {
                const ok = r.ok;
                return r.json().then(data => ({ ok, data }));
            }).then(({ok, data}) => {
                logMessage(cfg.message, cfg.channelID, ok ? 'success' : 'failed');
            }).catch(() => {
                logMessage(cfg.message, cfg.channelID, 'failed');
            });
        }

        // ===== Logs (realtime) =====
        const logMap = new Map();
        function logMessage(message, channelID, status) {
            const box = document.getElementById('logTableBody');
            if (box.querySelector('.empty-state')) box.innerHTML = '';

            // Update or create row by message+channel
            const key = channelID + '|' + (message||'');
            let row = logMap.get(key);
            if (!row) {
                row = document.createElement('div');
                row.className = 'log-row';
                row.innerHTML = `
                    <span class="log-status dot-pending"></span>
                    <div class="log-msg" title="${message||''}"></div>
                    <div class="log-meta">#${truncate(channelID,8)}</div>
                    <div class="log-time" style="color:var(--muted);font-size:.72rem"></div>
                    <span class="badge badge-log">pending</span>
                `;
                box.prepend(row);
                logMap.set(key, row);
            }

            const dot = row.querySelector('.log-status');
            const badge = row.querySelector('.badge-log');
            const timeEl = row.querySelector('.log-time');
            const msgDiv = row.querySelector('.log-msg');

            if (status === 'sending') {
                dot.className = 'log-status dot-pending';
                badge.textContent = 'sending';
                badge.className = 'badge badge-log';
                msgDiv.textContent = truncate(message, 60);
                timeEl.textContent = new Date().toLocaleTimeString();
            } else if (status === 'success') {
                dot.className = 'log-status dot-success';
                badge.textContent = 'Sent';
                badge.className = 'badge badge-log';
                timeEl.textContent = new Date().toLocaleTimeString();
                setTimeout(() => { box.removeChild(row); logMap.delete(key); }, 3500);
            } else {
                dot.className = 'log-status dot-error';
                badge.textContent = 'Failed';
                badge.className = 'badge badge-log';
                timeEl.textContent = new Date().toLocaleTimeString();
            }

            // Limit
            const rows = box.children;
            if (rows.length > 40) {
                const last = rows[rows.length - 1];
                box.removeChild(last);
                // remove from map
                const k = (last.querySelector('.log-meta')?.textContent||'').slice(1);
                logMap.delete(k);
            }
        }

        document.getElementById('clearLogsBtn').addEventListener('click', () => {
            const box = document.getElementById('logTableBody');
            if (!box || box.children.length < 2) return showToast.fire({icon:'info',title:'Tidak ada log'});
            confirmAction('Clear Logs', 'Hapus semua log?', () => {
                box.innerHTML = '<div class="empty-state"><i data-lucide="terminal"></i><div>Belum ada log.</div></div>';
                logMap.clear();
                safeIcons();
                showToast.fire({icon:'success',title:'Logs cleared'});
            });
        });

        // ===== Init =====
        // Cek login flag (index.html login)
        let loggedIn = true;
        try { loggedIn = localStorage.getItem('apd_logged') === '1'; } catch(e){}
        if (!loggedIn) {
            window.location.href = '/';
            return;
        }

        // Load token dari localStorage (jika pernah disimpan)
        try { token = localStorage.getItem('apd_token') || ''; } catch(e){}

        // Bind token input listener: setiap kali ketik, update localStorage & reload configs
        const tokenInput = document.getElementById('authToken');
        tokenInput.value = token;
        tokenInput.addEventListener('change', () => {
            token = tokenInput.value.trim();
            try { localStorage.setItem('apd_token', token); } catch(e){}
            loadConfigs();
        });

        loadConfigs();
        updateSelectedCount();
        safeIcons();
    });
</script>
</body>
</html>
