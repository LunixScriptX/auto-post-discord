<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Post Discord — Setup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.0/dist/sweetalert2.min.css">
    <style>
        :root{
            --bg:#313338;
            --bg-2:#2b2d31;
            --card:#1e1f22;
            --border:#3f4147;
            --text:#dbdee1;
            --muted:#949ba4;
            --accent:#5865f2;
            --accent-hover:#4752c4;
            --success:#57f39c;
            --danger:#da373c;
            --warn:#f5a623;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        body{
            font-family:'Inter',system-ui,-apple-system,sans-serif;
            background:
                radial-gradient(1200px 600px at 80% -10%, rgba(88,101,242,.12), transparent 60%),
                radial-gradient(900px 500px at -10% 110%, rgba(88,101,242,.08), transparent 55%),
                var(--bg);
            color:var(--text);
            min-height:100vh;
            padding:1.5rem;
        }
        .container{max-width:1000px;margin:0 auto}
        header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem}
        header h1{font-size:1.25rem;font-weight:700;display:flex;align-items:center;gap:.6rem}
        header h1 .logo{width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#7983f5);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(88,101,242,.35)}
        header h1 .logo svg{width:20px;height:20px;color:#fff}
        .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.25rem;margin-bottom:1.25rem;animation:fadeUp .3s ease}
        @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        .card h2,.card h3{font-weight:600;margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem}
        .card h2{font-size:1.1rem}
        .card h3{font-size:.95rem}
        .card h3 svg{width:18px;height:18px;color:var(--accent);flex-shrink:0}
        .card .sub{color:var(--muted);font-size:.82rem;line-height:1.5}
        label{font-size:.8rem;font-weight:500;color:var(--muted);margin-bottom:.3rem;display:block}
        .form-row{display:flex;gap:.75rem;flex-wrap:wrap}
        .form-row > div{flex:1;min-width:160px}
        .input{width:100%;padding:.6rem .8rem;border:1px solid var(--border);border-radius:8px;background:var(--bg-2);color:var(--text);font-size:.87rem;font-family:inherit;transition:border-color .15s,box-shadow .15s}
        .input:focus{outline:none;border-color:var(--accent);background:var(--card);box-shadow:0 0 0 3px rgba(88,101,242,.2)}
        .input.is-invalid{border-color:var(--danger);box-shadow:0 0 0 3px rgba(218,55,62,.25)}
        textarea.input{width:100%;min-height:70px;resize:vertical;font-family:inherit}
        .btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.6rem 1.1rem;border:none;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .15s;user-select:none}
        .btn:active{transform:scale(.96)}
        .btn svg{width:16px;height:16px}
        .btn-primary{background:var(--accent);color:#fff}
        .btn-primary:hover{background:var(--accent-hover);box-shadow:0 4px 14px rgba(88,101,242,.35)}
        .btn-secondary{background:var(--card-2);color:var(--text);border:1px solid var(--border)}
        .btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
        .btn-danger{background:rgba(218,55,62,.12);color:#ff7875;border:1px solid #ff7875}
        .btn-danger:hover{background:rgba(218,55,62,.24)}
        .btn-success{background:var(--success);color:#0a0a12}
        .btn-success:hover{filter:brightness(1.05)}
        .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;flex-wrap:wrap;gap:.5rem}
        .token-status{display:flex;align-items:center;gap:.4rem;font-size:.78rem;font-weight:600;padding:.3rem .7rem;border-radius:20px;margin-left:auto}
        .token-valid{background:rgba(87,243,156,.12);color:var(--success);border:1px solid var(--success)}
        .token-invalid{background:rgba(218,55,62,.12);color:#ff7875;border:1px solid #ff7875}
        .token-checking{background:rgba(245,166,35,.12);color:var(--warn);border:1px solid var(--warn)}
        .table-wrap{border:1px solid var(--border);border-radius:8px;overflow:hidden}
        table{width:100%;border-collapse:collapse;font-size:.87rem}
        th,td{padding:.7rem .9rem;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle}
        thead th{color:var(--muted);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.3px}
        tbody tr:hover{background:rgba(88,101,242,.06)}
        .btn-icon{width:32px;height:32px;padding:0;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .15s;margin:0 .15rem}
        .btn-icon:active{transform:scale(.85)}
        .btn-icon:hover{border-color:var(--accent);color:var(--accent);background:rgba(88,101,242,.1)}
        .btn-icon.danger:hover{border-color:var(--danger);color:var(--danger);background:rgba(218,55,62,.1)}
        .btn-icon svg{width:16px;height:16px}
        .btn-mini{display:inline-flex;align-items:center;gap:.3rem;padding:.35rem .8rem;border-radius:7px;font-size:.75rem;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text);transition:all .15s}
        .btn-mini:active{transform:scale(.94)}
        .btn-mini svg{width:14px;height:14px}
        .btn-mini.start{border-color:var(--success);color:var(--success)}
        .btn-mini.start:hover{background:rgba(87,243,156,.12)}
        .btn-mini.stop{border-color:var(--danger);color:#ff7875}
        .btn-mini.stop:hover{background:rgba(218,55,62,.12)}
        .badge{display:inline-flex;align-items:center;gap:.25rem;padding:.2rem .55rem;border-radius:6px;font-size:.72rem;font-weight:600}
        .badge-on{background:rgba(87,243,156,.15);color:var(--success)}
        .badge-off{background:rgba(148,155,164,.1);color:var(--muted);border:1px solid var(--border)}
        .logs-card{max-height:340px;overflow-y:auto}
        .log-row{display:flex;align-items:center;gap:.6rem;padding:.5rem .7rem;border-bottom:1px solid var(--border);font-size:.8rem;animation:fadeUp .2s ease}
        .log-row:last-child{border-bottom:none}
        .log-status{width:9px;height:9px;border-radius:50%;flex-shrink:0}
        .dot-success{background:var(--success)}
        .dot-error{background:var(--danger)}
        .dot-pending{background:var(--warn)}
        .log-msg{flex:1;word-break:break-word;color:var(--muted);min-width:0}
        .log-meta{color:var(--muted);font-size:.72rem;flex-shrink:0}
.badge-log{margin-left:.2rem;padding:.15rem .5rem;border-radius:6px;font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.3px;flex-shrink:0}
.badge-log[data-s="sending"]{background:rgba(245,166,35,.15);color:var(--warn)}
.badge-log[data-s="success"]{background:rgba(87,243,156,.15);color:var(--success)}
.badge-log[data-s="failed"]{background:rgba(218,55,62,.15);color:#ff7875}
        .empty-state{color:var(--muted);text-align:center;padding:1.25rem;font-size:.82rem}
        .empty-state svg{width:36px;height:36px;margin-bottom:.5rem;color:var(--border)}
        .toast-custom{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--accent)}
        @media(max-width:768px){
            .container{padding:0 .3rem}
            .form-row{flex-direction:column}
            .form-row > div{flex:1 1 100%}
            .table-wrap{overflow-x:auto}
            table{min-width:640px}
            header h1{font-size:1.05rem}
            .token-status{margin-left:0;width:100%;justify-content:center;margin-top:.5rem}
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1><span class="logo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.369a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.249a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.036A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.009c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.029ZM8.02 15.331c-1.182 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418Zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418Z"/></svg></span> Auto Post Discord — Setup</h1>
        <span id="tokenStatus" class="token-status token-checking">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" class="spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Cek token...
        </span>
    </header>

    <!-- Form Setup -->
    <div class="card">
        <h2><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> Setup Bot</h2>
        <p class="sub">Isi auth token Discord, pesan, channel, &amp; delay. Lalu klik Save Config.</p>

        <div class="form-row" style="margin-bottom:.75rem">
            <div>
                <label for="authToken">Auth Token Discord</label>
                <input type="password" id="authToken" class="input" placeholder="token...">
            </div>
            <div>
                <label for="message">Pesan</label>
                <input id="message" class="input" placeholder="Pesan oto post">
            </div>
        </div>
        <div class="form-row">
            <div>
                <label for="channelID">Channel ID</label>
                <input id="channelID" class="input" type="text" inputmode="numeric" placeholder="id channel">
            </div>
            <div>
                <label for="delay">Delay (ms)</label>
                <input id="delay" class="input" type="number" min="5" placeholder="min 5ms">
            </div>
        </div>
        <div style="margin-top:.9rem">
            <button id="addConfigBtn" class="btn btn-primary"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg> Save Config</button>
        </div>
    </div>

    <!-- Config List -->
    <div class="card">
        <div class="toolbar">
            <h3><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg> Config List</h3>
            <span class="badge badge-off" id="configCount">0 config</span>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Pesan</th>
                        <th style="width:130px">Channel ID</th>
                        <th style="width:90px">Delay (ms)</th>
                        <th style="width:70px">Status</th>
                        <th style="width:110px">Control</th>
                        <th style="width:90px">Aksi</th>
                    </tr>
                </thead>
                <tbody id="configTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Logs -->
    <div class="card logs-card">
        <div class="toolbar">
            <h3><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg> Realtime Logs</h3>
            <div style="display:flex;gap:.4rem">
                <button id="copyLogsBtn" class="btn btn-secondary btn-sm"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy</button>
                <button id="clearLogsBtn" class="btn btn-secondary btn-sm"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> Clear</button>
            </div>
        </div>
        <div id="logTableBody">
            <div class="empty-state"><svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg><div>Belum ada log.</div></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.0/dist/sweetalert2.all.min.js"></script>
<script>
    // Inline SVG icon helper — no external CDN dependency
    const ICONS = {
        edit: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>',
        trash: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
        play: '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
        pause: '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>',
        check: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>',
        x: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
        alert: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
    };

    document.addEventListener('DOMContentLoaded', () => {
        let botConfigs = [];
        let token = '';
        const timers = {};

        const showToast = (typeof Swal !== 'undefined') ? Swal.mixin({
            toast: true, position: 'top-end', showConfirmButton: false,
            timer: 2200, timerProgressBar: true,
            background: '#1e1f22', color: '#dbdee1', iconColor: '#5865f2',
            customClass: { popup: 'toast-custom' },
            didOpen: (t)=>{ t.onmouseenter=Swal.stopTimer; t.onmouseleave=Swal.resumeTimer; }
        }) : { fire: (o)=>alert(`${o.title||''} ${o.text||''}`) };

        const notify = (type, title, html='') => {
            if (typeof Swal !== 'undefined') Swal.fire({
                icon:type, title, html, background:'#1e1f22', color:'#dbdee1',
                confirmButtonColor: type==='error'?'#da373c':'#5865f2'
            }); else alert(`${type.toUpperCase()}: ${title}`);
        };
        const confirmAction = (title, text, onYes) => {
            if (typeof Swal !== 'undefined') {
                Swal.fire({ title, text, icon:'warning', showCancelButton:true, confirmButtonColor:'#5865f2',
                    cancelButtonColor:'#d33', confirmButtonText:'Ya', background:'#1e1f22', color:'#dbdee1'
                }).then(r => { if (r.isConfirmed) onYes(); });
            } else if (confirm(`${title}\n${text}`)) onYes();
        };
        const truncate = (t,n) => {
            const s = String(t || '');
            return s.length <= n ? s : s.substring(0,n-3)+'...';
        };

        // ===== Token validation =====
        function setTokenStatus(state, label) {
            const el = document.getElementById('tokenStatus');
            el.className = 'token-status ' + (state === 'valid' ? 'token-valid' : state === 'invalid' ? 'token-invalid' : 'token-checking');
            el.innerHTML = (state === 'valid' ? ICONS.check : state === 'invalid' ? ICONS.x : '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" class="spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>') + ' ' + label;
        }

        async function checkToken(tk) {
            if (!tk) { setTokenStatus('invalid', 'Token kosong'); return false; }
            setTokenStatus('checking', 'Cek token...');
            try {
                const res = await fetch('/check-token', {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({ token: tk })
                });
                const data = await res.json();
                if (data.success && data.valid) {
                    setTokenStatus('valid', 'Token valid');
                    return true;
                } else {
                    setTokenStatus('invalid', 'Token invalid');
                    return false;
                }
            } catch(e) {
                setTokenStatus('invalid', 'Gagal cek');
                return false;
            }
        }

        // ===== Render table =====
        function renderTable() {
            const tbody = document.getElementById('configTableBody');
            tbody.innerHTML = '';
            if (botConfigs.length === 0) {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td colspan="6"><div class="empty-state"><svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg><div>Belum ada config. Tambahkan di atas.</div></div></td>`;
                tbody.appendChild(tr);
                return;
            }
            const frag = document.createDocumentFragment();
            botConfigs.forEach((cfg, i) => {
                const tr = document.createElement('tr');

                const tdMsg = document.createElement('td');
                tdMsg.title = cfg.message;
                tdMsg.textContent = truncate(cfg.message, 30);
                tdMsg.style.maxWidth = '200px';
                tr.appendChild(tdMsg);

                const tdCh = document.createElement('td');
                tdCh.textContent = cfg.channelID;
                tr.appendChild(tdCh);

                const tdDelay = document.createElement('td');
                tdDelay.textContent = cfg.delay;
                tr.appendChild(tdDelay);

                const tdStatus = document.createElement('td');
                tdStatus.innerHTML = cfg.running
                    ? `<span class="badge badge-on">Running</span>`
                    : `<span class="badge badge-off">Stopped</span>`;
                tr.appendChild(tdStatus);

                // Control: Start / Stop per config
                const tdCtrl = document.createElement('td');
                const ctrlBtn = document.createElement('button');
                ctrlBtn.className = 'btn-mini ' + (cfg.running ? 'stop' : 'start');
                ctrlBtn.innerHTML = (cfg.running ? ICONS.pause : ICONS.play) + (cfg.running ? ' Stop' : ' Start');
                ctrlBtn.addEventListener('click', () => toggleConfig(i));
                tdCtrl.appendChild(ctrlBtn);
                tr.appendChild(tdCtrl);

                // Actions: edit + delete
                const tdAct = document.createElement('td');
                const editBtn = document.createElement('button');
                editBtn.className = 'btn-icon'; editBtn.title = 'Edit';
                editBtn.innerHTML = ICONS.edit;
                editBtn.addEventListener('click', () => editConfig(i));
                const delBtn = document.createElement('button');
                delBtn.className = 'btn-icon danger'; delBtn.title = 'Hapus';
                delBtn.innerHTML = ICONS.trash;
                delBtn.addEventListener('click', () => deleteConfig(i));
                tdAct.append(editBtn, delBtn);
                tr.appendChild(tdAct);

                frag.appendChild(tr);
            });
            tbody.appendChild(frag);
        }

        function updateCount() {
            document.getElementById('configCount').textContent = botConfigs.length + ' config';
        }

        // ===== Save / load configs =====
        function saveConfigs() {
            fetch('/save-configs', {
                method:'POST', headers:{'Content-Type':'application/json'},
                body:JSON.stringify({ token, configs: botConfigs.map(c => ({
                    message:c.message, channelID:c.channelID, delay:c.delay,
                    selected:c.selected, active:c.active
                })) })
            }).catch(e => console.error('save error', e));
        }

        async function loadConfigs() {
            if (!token) return;
            try {
                const res = await fetch(`/load-configs?token=${encodeURIComponent(token)}`);
                const data = await res.json();
                if (data.success) {
                    botConfigs = (Array.isArray(data.configs) ? data.configs : []).map(c => ({
                        message:c.message, channelID:c.channelID, delay:c.delay,
                        selected:c.selected!==false, active:c.active!==false, running:false
                    }));
                    renderTable();
                    updateCount();
                }
            } catch(e) { console.error('Load error:', e); }
        }

        // ===== Add config =====
        document.getElementById('addConfigBtn').addEventListener('click', async () => {
            const t = document.getElementById('authToken').value.trim();
            const m = document.getElementById('message').value.trim();
            const c = document.getElementById('channelID').value.trim();
            const d = document.getElementById('delay').value.trim();

            if (!t || !m || !c || !d) {
                return notify('error', 'Validasi Gagal', 'Isi semua field (token, message, channel, delay).');
            }
            if (!/^\d{10,}$/.test(c)) {
                return notify('error', 'Channel ID Salah', 'Channel ID harus angka ≥ 10 digit.');
            }
            if (parseInt(d) < 5) {
                return notify('error', 'Delay minimal 5ms');
            }
            token = t;
            try { localStorage.setItem('apd_token', token); } catch(e){}
            const ok = await checkToken(t);
            if (!ok) {
                return notify('error', 'Token Invalid', 'Token Discord tidak valid. Cek kembali.');
            }
            botConfigs.push({ message:m, channelID:String(c), delay:parseInt(d), selected:true, active:true, running:false });
            saveConfigs();
            renderTable();
            updateCount();
            document.getElementById('message').value = '';
            document.getElementById('channelID').value = '';
            document.getElementById('delay').value = '';
            showToast.fire({ icon:'success', title:'Config disimpan' });
        });

        // ===== Edit config =====
        async function editConfig(i) {
            const cfg = botConfigs[i];
            const r = await Swal.fire({
                title:'Edit Config', background:'#1e1f22', color:'#dbdee1',
                html:`
                    <input id="m" class="swal2-input" value="${cfg.message}" placeholder="Pesan">
                    <input id="c" class="swal2-input" value="${cfg.channelID}" placeholder="Channel ID" type="text">
                    <input id="d" class="swal2-input" value="${cfg.delay}" placeholder="Delay (ms)" type="number" min="5">
                `,
                focusConfirm:false, showCancelButton:true, confirmButtonText:'Simpan',
                preConfirm:() => {
                    const m=document.getElementById('m').value.trim();
                    const c=document.getElementById('c').value.trim();
                    const d=document.getElementById('d').value.trim();
                    if(!m||!c||!d){Swal.showValidationMessage('Isi semua field');return false;}
                    if(!/^\d{10,}$/.test(c)){Swal.showValidationMessage('Channel ID harus angka ≥ 10 digit');return false;}
                    if(parseInt(d)<5){Swal.showValidationMessage('Delay minimal 5ms');return false;}
                    return {message:m, channelID:String(c), delay:parseInt(d)};
                }
            });
            if (r.value) {
                botConfigs[i].message = r.value.message;
                botConfigs[i].channelID = r.value.channelID;
                botConfigs[i].delay = r.value.delay;
                saveConfigs();
                renderTable();
                showToast.fire({ icon:'success', title:'Diperbarui' });
            }
        }

        // ===== Delete config =====
        function deleteConfig(i) {
            confirmAction('Hapus Config', 'Yakin hapus config ini?', () => {
                if (botConfigs[i].running && timers[i]) { clearInterval(timers[i]); delete timers[i]; }
                botConfigs.splice(i, 1);
                saveConfigs();
                renderTable();
                updateCount();
                showToast.fire({ icon:'success', title:'Dihapus' });
            });
        }

        // ===== Start / Stop per config =====
        function toggleConfig(i) {
            const cfg = botConfigs[i];
            if (cfg.running) {
                if (timers[i]) { clearInterval(timers[i]); delete timers[i]; }
                cfg.running = false;
                renderTable();
                showToast.fire({ icon:'info', title:'Dihentikan' });
            } else {
                if (!token) return notify('error', 'Token belum diisi');
                cfg.running = true;
                renderTable();
                sendNow(cfg, token);
                timers[i] = setInterval(() => sendNow(cfg, token), cfg.delay);
                showToast.fire({ icon:'success', title:'Started' });
            }
        }

        // ===== Send message (via server proxy to bypass CORS) =====
        function sendNow(cfg, tk) {
            const auth = tk || token;
            if (!auth) {
                logMessage(cfg.message, cfg.channelID, 'failed', 'Token kosong');
                return;
            }
            if (!cfg.channelID) {
                logMessage(cfg.message, cfg.channelID, 'failed', 'Channel ID kosong');
                return;
            }
            logMessage(cfg.message, cfg.channelID, 'sending');
            fetch('/send-message', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({ token: auth, channelID: cfg.channelID, message: cfg.message })
            }).then(async (r) => {
                let data = {};
                try { data = await r.json(); } catch(e) {}
                // data.ok reflects the real Discord API result (proxy returns 200 either way)
                if (data && data.ok) {
                    logMessage(cfg.message, cfg.channelID, 'success');
                } else {
                    const detail = (data && data.data && (data.data.message || JSON.stringify(data.data))) || `HTTP ${r.status}`;
                    logMessage(cfg.message, cfg.channelID, 'failed', `${data && data.status ? data.status + ': ' : ''}${detail}`.slice(0,120));
                }
            }).catch((err) => {
                logMessage(cfg.message, cfg.channelID, 'failed', err.message || 'Network error');
            });
        }

        // ===== Logs =====
        const logMap = new Map();
        function logMessage(message, channelID, status, detail='') {
            const box = document.getElementById('logTableBody');
            if (box.querySelector('.empty-state')) box.innerHTML = '';
            const key = channelID + '|' + (message||'');
            let row = logMap.get(key);
            if (!row) {
                row = document.createElement('div');
                row.className = 'log-row';
                row.innerHTML = `
                    <span class="log-status dot-pending"></span>
                    <div class="log-msg" title="${message||''}"></div>
                    <div class="log-meta">#${truncate(channelID,8)}</div>
                    <div class="log-time" style="color:var(--muted);font-size:.72rem"></div>
                    <span class="badge badge-log" data-s="pending">pending</span>`;
                box.prepend(row);
                logMap.set(key, row);
            }
            const dot = row.querySelector('.log-status');
            const badge = row.querySelector('.badge-log');
            const timeEl = row.querySelector('.log-time');
            const msgDiv = row.querySelector('.log-msg');
            if (status === 'sending') {
                dot.className='log-status dot-pending'; badge.textContent='sending'; badge.dataset.s='sending';
                msgDiv.textContent=truncate(message,60); timeEl.textContent=new Date().toLocaleTimeString();
            } else if (status === 'success') {
                dot.className='log-status dot-success'; badge.textContent='Sent'; badge.dataset.s='success';
                msgDiv.textContent=truncate(message,60); timeEl.textContent=new Date().toLocaleTimeString();
                setTimeout(()=>{ if(row.parentNode){box.removeChild(row);} logMap.delete(key); }, 3500);
            } else {
                dot.className='log-status dot-error'; badge.textContent='Failed'; badge.dataset.s='failed';
                msgDiv.textContent=truncate(message + (detail ? ' | ' + detail : ''), 60); timeEl.textContent=new Date().toLocaleTimeString();
            }
            const rows = box.children;
            if (rows.length > 40) { const last = rows[rows.length-1]; box.removeChild(last); }
        }

        document.getElementById('clearLogsBtn').addEventListener('click', () => {
            const box = document.getElementById('logTableBody');
            if (!box) return showToast.fire({icon:'info',title:'Tidak ada log'});
            confirmAction('Clear Logs', 'Hapus semua log?', () => {
                box.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg><div>Belum ada log.</div></div>';
                logMap.clear();
                showToast.fire({icon:'success',title:'Logs cleared'});
            });
        });

        document.getElementById('copyLogsBtn').addEventListener('click', () => {
            const box = document.getElementById('logTableBody');
            const rows = Array.from(box.querySelectorAll('.log-row'));
            if (rows.length === 0) return showToast.fire({icon:'info',title:'Tidak ada log untuk disalin'});
            const text = rows.map(r => {
                const time = r.querySelector('.log-time')?.textContent || '';
                const msg = r.querySelector('.log-msg')?.textContent || '';
                const status = r.querySelector('.badge-log')?.textContent || '';
                return `[${time}] ${status.toUpperCase()} - ${msg}`;
            }).join('\n');
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => showToast.fire({icon:'success', title:'Logs disalin'}))
                    .catch(() => showToast.fire({icon:'error', title:'Gagal salin'}));
            } else {
                showToast.fire({icon:'error', title:'Clipboard tidak didukung'});
            }
        });

        // ===== Init =====
        let loggedIn = true;
        try { loggedIn = localStorage.getItem('apd_logged') === '1'; } catch(e){}
        if (!loggedIn) { window.location.href = '/'; return; }

        try { token = localStorage.getItem('apd_token') || ''; } catch(e){}
        const tokenInput = document.getElementById('authToken');
        tokenInput.value = token;
        tokenInput.addEventListener('input', () => {
            token = tokenInput.value.trim();
            try { localStorage.setItem('apd_token', token); } catch(e){}
            checkToken(token);
        });
        tokenInput.addEventListener('blur', () => {
            token = tokenInput.value.trim();
            try { localStorage.setItem('apd_token', token); } catch(e){}
            checkToken(token);
            loadConfigs();
        });

        if (token) checkToken(token);
        loadConfigs();
        updateCount();
    });
</script>
<style>.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style>
</body>
</html>
