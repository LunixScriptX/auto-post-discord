<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Post Discord — Konfigurasi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.0/dist/sweetalert2.min.css">
    <style>
        :root{
            --bg:#313338;
            --bg-2:#2b2d31;
            --card:#1e1f22;
            --card-2:#2b2d31;
            --border:#3f4147;
            --text:#dbdee1;
            --muted:#949ba4;
            --accent:#5865f2;
            --accent-hover:#4752c4;
            --success:#57f39c;
            --danger:#da373c;
            --gradient:linear-gradient(135deg,var(--accent),#7983f5);
        }
        *{box-sizing:border-box;margin:0;padding:0}
        body{
            font-family:'Inter',system-ui,-apple-system,sans-serif;
            background:
                radial-gradient(1200px 600px at 80% -10%, rgba(88,101,242,.12), transparent 60%),
                radial-gradient(900px 500px at -10% 110%, rgba(88,101,242,.08), transparent 55%),
                var(--bg);
            color:var(--text);
            min-height:100vh;
            padding:1.5rem;
        }
        .container{max-width:960px;margin:0 auto}
        header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem}
        header h1{font-size:1.25rem;font-weight:700;display:flex;align-items:center;gap:.6rem}
        header .logo{width:36px;height:36px;border-radius:10px;background:var(--gradient);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(88,101,242,.35)}
        header .logo svg{width:20px;height:20px;color:#fff}
        .account-info{color:var(--muted);font-size:.85rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
        .account-info span{color:var(--accent);font-weight:600}
        .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.1rem;margin-bottom:1.25rem;animation:fadeUp .3s ease}
        @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        .card.compact{padding:.85rem}
        .card h3{font-size:1rem;font-weight:600;margin-bottom:.75rem;display:flex;align-items:center;gap:.5rem}
        .card h3 svg{width:18px;height:18px;color:var(--accent)}
        .table-wrap{border:1px solid var(--border);border-radius:8px;overflow:hidden}
        table{width:100%;border-collapse:collapse;font-size:.87rem}
        th,td{padding:.7rem .9rem;text-align:left;border-bottom:1px solid var(--border)}
        thead th{color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.3px}
        tbody tr{animation:fadeUp .25s ease}
        tbody tr:hover{background:rgba(88,101,242,.06)}
        .form-label{font-size:.8rem;font-weight:500;color:var(--muted);margin-bottom:.3rem;display:block}
        .input,select{width:100%;padding:.55rem .8rem;border:1px solid var(--border);border-radius:8px;background:var(--bg-2);color:var(--text);font-size:.87rem;font-family:inherit;transition:border-color .15s,box-shadow .15s}
        .input:focus,select:focus{outline:none;border-color:var(--accent);background:var(--card);box-shadow:0 0 0 3px rgba(88,101,242,.2)}
        textarea.input{width:100%;min-height:70px;resize:vertical;font-family:inherit}
        .row{display:flex;gap:.75rem;flex-wrap:wrap}
        .row > div{flex:1;min-width:160px}
        .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;flex-wrap:wrap;gap:.5rem}
        .btn{
            display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
            padding:.5rem .9rem;border:none;border-radius:8px;font-size:.85rem;font-weight:600;
            cursor:pointer;transition:all .15s;user-select:none;
        }
        .btn:active{transform:scale(.94)}
        .btn svg{width:16px;height:16px}
        .btn-primary{background:var(--accent);color:#fff}
        .btn-primary:hover{background:var(--accent-hover);box-shadow:0 4px 14px rgba(88,101,242,.35)}
        .btn-secondary{background:var(--card-2);color:var(--text);border:1px solid var(--border)}
        .btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
        .btn-danger{background:rgba(218,55,62,.12);color:#ff7875;border:1px solid #ff7875}
        .btn-danger:hover{background:rgba(218,55,62,.24)}
        .btn-success{background:var(--success);color:#0a0a12}
        .btn-success:hover{filter:brightness(1.08)}
        .btn-icon{
            width:34px;height:34px;padding:0;border-radius:8px;border:1px solid var(--border);
            background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;
            transition:all .15s;margin:0 .15rem;
        }
        .btn-icon:active{transform:scale(.88)}
        .btn-icon:hover{border-color:var(--accent);color:var(--accent);background:rgba(88,101,242,.1)}
        .btn-icon.danger:hover{border-color:var(--danger);color:var(--danger);background:rgba(218,55,62,.1)}
        .toggle-wrapper{display:flex;align-items:center;gap:.6rem;cursor:pointer;user-select:none}
        .switch{position:relative;display:inline-flex;align-items:center;width:46px;height:26px;background:var(--border);border-radius:999px;cursor:pointer;transition:background .25s}
        .switch.checked{background:var(--accent)}
        .switch .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.4,0,.2,1);box-shadow:0 1px 3px rgba(0,0,0,.3)}
        .switch.checked .knob{transform:translateX(20px)}
        .check-btn{
            width:38px;height:38px;border-radius:10px;border:2px solid var(--border);
            background:var(--bg-2);cursor:pointer;display:flex;align-items:center;justify-content:center;
            color:var(--muted);transition:all .2s;
        }
        .check-btn:active{transform:scale(.85)}
        .check-btn.on{border-color:var(--accent);background:rgba(88,101,242,.18);color:var(--accent)}
        .check-btn svg{width:20px;height:20px}
        .badge{display:inline-flex;align-items:center;gap:.25rem;padding:.25rem .6rem;border-radius:6px;font-size:.72rem;font-weight:600}
        .badge-active{background:rgba(88,101,242,.15);color:var(--accent)}
        .badge-inactive{background:rgba(148,155,164,.1);color:var(--muted);border:1px solid var(--border)}
        .controls{margin-top:.75rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.75rem}
        #toggleBtn{width:100%;max-width:200px}
        .status-badge{display:inline-flex;align-items:center;gap:.4rem;padding:.4rem .8rem;border-radius:20px;font-size:.8rem;font-weight:600;transition:all .2s}
        .status-running{background:rgba(87,243,156,.12);color:var(--success);border:1px solid var(--success)}
        .status-stopped{background:rgba(148,155,164,.1);color:var(--muted);border:1px solid var(--border)}
        .logs-card{max-height:320px;overflow-y:auto}
        .log-row{display:flex;align-items:center;gap:.6rem;padding:.5rem .7rem;border-bottom:1px solid var(--border);font-size:.8rem;animation:fadeUp .2s ease}
        .log-row:last-child{border-bottom:none}
        .log-status{width:10px;height:10px;border-radius:50%;flex-shrink:0}
        .status-dot-success{background:var(--success)}
        .status-dot-error{background:var(--danger)}
        .status-dot-pending{background:#f5a623}
        .log-msg{flex:1;word-break:break-word;color:var(--muted)}
        .log-meta{color:var(--muted);font-size:.75rem}
        .empty-state{color:var(--muted);text-align:center;padding:1.5rem;font-size:.85rem}
        .empty-state svg{width:36px;height:36px;margin-bottom:.5rem;color:var(--border)}
        .toast-custom{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--accent)}
        @media(max-width:768px){.container{padding:0 .5rem}.row > div{flex:1 1 100%}}
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1><span class="logo"><i data-lucide="send"></i></span>Auto Post Discord</h1>
        <div class="account-info">
            Akun: <span id="accountInfo">...</span>
            <span id="statusBadge" class="status-badge status-stopped">
                <span style="width:8px;height:8px;border-radius:50%;background:var(--muted)"></span>
                <span>Stopped</span>
            </span>
        </div>
    </header>

    <form id="configForm">
    <div class="card">
        <h3><i data-lucide="settings-2"></i> Tambah Konfigurasi</h3>
        <div class="row">
            <div style="flex:2;min-width:200px">
                <label class="form-label">Pesan</label>
                <textarea id="message" class="input" placeholder="Pesan yang akan diposting"></textarea>
            </div>
            <div style="flex:1;min-width:140px">
                <label class="form-label">Channel ID</label>
                <input id="channelID" class="input" type="number" placeholder="ID channel">
            </div>
            <div style="flex:1;min-width:140px">
                <label class="form-label">Delay (ms)</label>
                <input id="delay" class="input" type="number" min="5" placeholder="min 5ms">
            </div>
        </div>
        <div class="controls">
            <button type="button" id="addConfigBtn" class="btn btn-secondary"><i data-lucide="plus"></i> Tambah</button>
            <div class="toggle-wrapper" id="toggleAll">
                <span class="switch checked" id="toggleAllSwitch"><span class="knob"></span></span>
                <label class="form-label" style="margin:0;cursor:pointer">Aktifkan semua</label>
            </div>
        </div>
    </div>
    </form>

    <div class="card">
        <div class="toolbar">
            <h3 style="margin:0"><i data-lucide="layers"></i> Daftar Konfigurasi</h3>
            <span class="badge badge-inactive" id="configCount">0 config</span>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th style="width:50px"></th>
                        <th>Pesan</th>
                        <th style="width:120px">Channel ID</th>
                        <th style="width:90px">Delay (ms)</th>
                        <th style="width:80px">Status</th>
                        <th style="width:120px">Aksi</th>
                    </tr>
                </thead>
                <tbody id="configTableBody"></tbody>
            </table>
        </div>
    </div>

    <div class="card compact" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem">
        <div class="account-info" style="margin:0">
            Pilih minimal <span style="color:var(--accent)">1 konfigurasi aktif</span> lalu klik Mulai.
        </div>
        <button id="toggleBtn" class="btn btn-success"><i data-lucide="play"></i> Mulai Otomatis</button>
    </div>

    <div class="card logs-card">
        <div class="toolbar">
            <h3 style="margin:0"><i data-lucide="clipboard-list"></i> Log Kirim</h3>
            <button id="clearLogsBtn" class="btn btn-secondary btn-sm"><i data-lucide="trash-2"></i> Clear</button>
        </div>
        <div id="logTableBody"><div class="empty-state"><i data-lucide="terminal"></i><div>Belum ada log.</div></div></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.0/dist/sweetalert2.all.min.js"></script>
<script>
    function safeIcons(){ if (typeof lucide !== 'undefined') lucide.createIcons(); }

    document.addEventListener('DOMContentLoaded', () => {
        let botConfigs = [];
        let activeConfigs = [];
        let postInterval = null;
        let currentAuthToken = '';
        let allEnabled = true;

        const showToast = (typeof Swal !== 'undefined') ? Swal.mixin({
            toast: true, position: 'top-end', showConfirmButton: false, timer: 2200, timerProgressBar: true,
            background: '#1e1f22', color: '#dbdee1', iconColor: '#5865f2',
            customClass: { popup: 'toast-custom' },
            didOpen: (t) => { t.onmouseenter = Swal.stopTimer; t.onmouseleave = Swal.resumeTimer; }
        }) : { fire: (o) => alert(`${o.title}: ${o.text||''}`) };

        const notify = (type, title, html='') => {
            if (typeof Swal !== 'undefined') Swal.fire({ icon:type, title, html, background:'#1e1f22', color:'#dbdee1', confirmButtonColor: type==='error'?'#da373c':'#5865f2' });
            else alert(`${type.toUpperCase()}: ${title}`);
        };

        const confirmAction = (title, text, onYes) => {
            if (typeof Swal !== 'undefined') {
                Swal.fire({ title, text, icon:'warning', showCancelButton:true, confirmButtonColor:'#5865f2', cancelButtonColor:'#d33', confirmButtonText:'Ya', background:'#1e1f22', color:'#dbdee1' }).then(r => { if (r.isConfirmed) onYes(); });
            } else if (confirm(`${title}\n${text}`)) onYes();
        };

        // ---- Render table via DOM (no innerHTML → listeners persist) ----
        function renderTable() {
            const tbody = document.getElementById('configTableBody');
            tbody.innerHTML = '';
            if (botConfigs.length === 0) {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td colspan="6"><div class="empty-state"><i data-lucide="inbox"></i><div>Belum ada konfigurasi. Tambahkan di atas.</div></div></td>`;
                tbody.appendChild(tr);
                safeIcons();
                return;
            }
            botConfigs.forEach((cfg, i) => {
                const tr = document.createElement('tr');

                // checkbox cell
                const tdCheck = document.createElement('td');
                const btn = document.createElement('button');
                btn.className = 'check-btn' + (cfg.active !== false ? ' on' : '');
                btn.title = cfg.active !== false ? 'Nonaktifkan' : 'Aktifkan';
                btn.innerHTML = `<i data-lucide="${cfg.active !== false ? 'check-square' : 'square'}"></i>`;
                btn.addEventListener('click', () => toggleConfig(i));
                tdCheck.appendChild(btn);
                tr.appendChild(tdCheck);

                // message
                const tdMsg = document.createElement('td');
                tdMsg.title = cfg.message;
                tdMsg.textContent = truncate(cfg.message, 40);
                tr.appendChild(tdMsg);

                // channel
                const tdCh = document.createElement('td');
                tdCh.textContent = cfg.channelID;
                tr.appendChild(tdCh);

                // delay
                const tdDelay = document.createElement('td');
                tdDelay.textContent = cfg.delay;
                tr.appendChild(tdDelay);

                // status
                const tdStatus = document.createElement('td');
                tdStatus.innerHTML = cfg.active === false
                    ? `<span class="badge badge-inactive">Off</span>`
                    : `<span class="badge badge-active">On</span>`;
                tr.appendChild(tdStatus);

                // actions
                const tdAct = document.createElement('td');
                const editBtn = document.createElement('button');
                editBtn.className = 'btn-icon';
                editBtn.title = 'Edit';
                editBtn.innerHTML = '<i data-lucide="edit-2"></i>';
                editBtn.addEventListener('click', () => editConfig(i));
                const delBtn = document.createElement('button');
                delBtn.className = 'btn-icon danger';
                delBtn.title = 'Hapus';
                delBtn.innerHTML = '<i data-lucide="trash-2"></i>';
                delBtn.addEventListener('click', () => deleteConfig(i));
                tdAct.appendChild(editBtn);
                tdAct.appendChild(delBtn);
                tr.appendChild(tdAct);

                tbody.appendChild(tr);
            });
            safeIcons();
            document.getElementById('configCount').textContent = botConfigs.length + ' config';
        }

        function toggleConfig(i) {
            botConfigs[i].active = botConfigs[i].active !== false ? false : true;
            syncActive();
            saveConfigs();
            renderTable();
            const on = botConfigs[i].active !== false;
            showToast.fire({ icon: on ? 'success' : 'info', title: on ? 'Diaktifkan' : 'Dimatikan' });
        }

        function syncActive() {
            activeConfigs = botConfigs.filter(c => c.active !== false);
            allEnabled = activeConfigs.length === botConfigs.length;
            document.getElementById('toggleAllSwitch').classList.toggle('checked', allEnabled);
        }

        function toggleAll() {
            allEnabled = !allEnabled;
            botConfigs.forEach((c, i) => c.active = allEnabled);
            document.getElementById('toggleAllSwitch').classList.toggle('checked', allEnabled);
            syncActive();
            saveConfigs();
            renderTable();
            showToast.fire({ icon: allEnabled ? 'success' : 'info', title: allEnabled ? 'Semua aktif' : 'Semua mati' });
        }

        // ---- Add config ----
        document.getElementById('addConfigBtn').addEventListener('click', async () => {
            const r = await Swal.fire({
                title:'Tambah Konfigurasi', background:'#1e1f22', color:'#dbdee1',
                html:`<textarea id="m" class="swal2-textarea" placeholder="Pesan"></textarea>
                      <input id="c" class="swal2-input" placeholder="Channel ID" type="number">
                      <input id="d" class="swal2-input" placeholder="Delay (ms)" type="number" min="5">`,
                focusConfirm:false, showCancelButton:true, confirmButtonText:'Simpan',
                preConfirm:() => {
                    const m=document.getElementById('m').value.trim();
                    const c=document.getElementById('c').value.trim();
                    const d=document.getElementById('d').value.trim();
                    if(!m||!c||!d){Swal.showValidationMessage('Semua field wajib diisi');return false;}
                    if(parseInt(d)<5){Swal.showValidationMessage('Delay minimal 5ms');return false;}
                    return {message:m, channelID:parseInt(c), delay:parseInt(d)};
                }
            });
            if (r.value) {
                botConfigs.push(r.value);
                syncActive();
                saveConfigs();
                renderTable();
                showToast.fire({ icon:'success', title:'Ditambahkan' });
            }
        });

        // ---- Edit ----
        async function editConfig(i) {
            const cfg = botConfigs[i];
            const r = await Swal.fire({
                title:'Edit Konfigurasi', background:'#1e1f22', color:'#dbdee1',
                html:`<input id="m" class="swal2-input" value="${cfg.message}" placeholder="Pesan">
                      <input id="c" class="swal2-input" value="${cfg.channelID}" placeholder="Channel ID" type="number">
                      <input id="d" class="swal2-input" value="${cfg.delay}" placeholder="Delay (ms)" type="number" min="5">`,
                focusConfirm:false, showCancelButton:true, confirmButtonText:'Simpan',
                preConfirm:() => {
                    const m=document.getElementById('m').value.trim();
                    const c=document.getElementById('c').value.trim();
                    const d=document.getElementById('d').value.trim();
                    if(!m||!c||!d){Swal.showValidationMessage('Semua field wajib diisi');return false;}
                    if(parseInt(d)<5){Swal.showValidationMessage('Delay minimal 5ms');return false;}
                    return {message:m, channelID:parseInt(c), delay:parseInt(d)};
                }
            });
            if (r.value) {
                const wasActive = cfg.active !== false;
                botConfigs[i] = r.value;
                botConfigs[i].active = wasActive;
                syncActive();
                saveConfigs();
                renderTable();
                showToast.fire({ icon:'success', title:'Diperbarui' });
            }
        }

        // ---- Delete ----
        function deleteConfig(i) {
            confirmAction('Hapus Konfigurasi', 'Yakin menghapus konfigurasi ini?', () => {
                botConfigs.splice(i, 1);
                syncActive();
                saveConfigs();
                renderTable();
                showToast.fire({ icon:'success', title:'Dihapus' });
            });
        }

        document.getElementById('toggleAll').addEventListener('click', toggleAll);

        // ---- Auto post ----
        document.getElementById('toggleBtn').addEventListener('click', () => {
            const btn = document.getElementById('toggleBtn');
            const badge = document.getElementById('statusBadge');
            const isStarted = postInterval === null;

            if (isStarted) {
                if (activeConfigs.length === 0) {
                    notify('error', 'Pilih minimal 1 config');
                    return;
                }
                startAutoPost();
                btn.innerHTML = '<i data-lucide="pause"></i> Hentikan';
                btn.className = 'btn btn-danger';
                badge.innerHTML = '<span style="width:8px;height:8px;border-radius:50%;background:var(--success)"></span><span>Running</span>';
                badge.className = 'status-badge status-running';
                safeIcons();
                showToast.fire({ icon:'success', title:'Auto post dimulai' });
            } else {
                stopAutoPost();
                btn.innerHTML = '<i data-lucide="play"></i> Mulai Otomatis';
                btn.className = 'btn btn-success';
                badge.innerHTML = '<span style="width:8px;height:8px;border-radius:50%;background:var(--muted)"></span><span>Stopped</span>';
                badge.className = 'status-badge status-stopped';
                safeIcons();
                showToast.fire({ icon:'success', title:'Auto post dihentikan' });
            }
            saveAutoPostState(isStarted ? 'started' : 'stopped');
        });

        function startAutoPost() {
            if (activeConfigs.length === 0) return;
            let idx = 0;
            sendMessage(currentAuthToken, activeConfigs[idx].channelID, activeConfigs[idx].message);
            idx = (idx + 1) % activeConfigs.length;
            postInterval = setInterval(() => {
                sendMessage(currentAuthToken, activeConfigs[idx].channelID, activeConfigs[idx].message);
                idx = (idx + 1) % activeConfigs.length;
            }, activeConfigs[0].delay);
        }
        function stopAutoPost() { clearInterval(postInterval); postInterval = null; }

        function saveAutoPostState(state) {
            fetch(`/conf/${currentAuthToken}/save-auto-post-state`, {
                method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({state})
            }).catch(e => console.error('save state error', e));
        }

        function saveConfigs() {
            fetch(`/conf/${currentAuthToken}/save-configs`, {
                method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({configs:botConfigs})
            }).catch(e => console.error('save configs error', e));
        }

        async function loadConfigs() {
            try {
                const res = await fetch(`/conf/${currentAuthToken}/load-configs`);
                const data = await res.json();
                if (data.success) {
                    botConfigs = Array.isArray(data.configs) ? data.configs : [];
                    syncActive();
                    renderTable();
                    document.getElementById('accountInfo').textContent = 'Terhubung';
                    document.getElementById('accountInfo').style.color = 'var(--success)';
                    if (data.autoPostState === 'started' && activeConfigs.length > 0) {
                        startAutoPost();
                        const btn = document.getElementById('toggleBtn');
                        btn.innerHTML = '<i data-lucide="pause"></i> Hentikan';
                        btn.className = 'btn btn-danger';
                        const badge = document.getElementById('statusBadge');
                        badge.innerHTML = '<span style="width:8px;height:8px;border-radius:50%;background:var(--success)"></span><span>Running</span>';
                        badge.className = 'status-badge status-running';
                        safeIcons();
                    }
                }
            } catch (e) { console.error('load error', e); }
        }

        function sendMessage(token, channelID, message) {
            fetch(`https://discord.com/api/v10/channels/${channelID}/messages`, {
                method:'POST', headers:{'Authorization':token,'Content-Type':'application/json'},
                body:JSON.stringify({content:message})
            }).then(r => r.json()).then(d => {
                logMessage(message, channelID, d.id ? 'Success' : 'Failed');
            }).catch(() => logMessage(message, channelID, 'Error'));
        }

        function logMessage(message, channelID, response) {
            const box = document.getElementById('logTableBody');
            if (box.querySelector('.empty-state')) box.innerHTML = '';
            const row = document.createElement('div');
            row.className = 'log-row';
            const ok = response === 'Success';
            row.innerHTML = `
                <span class="log-status status-dot-${ok?'success':'error'}"></span>
                <div class="log-msg" title="${message}">${truncate(message,60)}</div>
                <div class="log-meta">#${truncate(channelID,8)}</div>
                <div class="log-meta">${new Date().toLocaleTimeString()}</div>
                <span class="badge ${ok?'badge-active':'badge-inactive'}">${response}</span>`;
            box.prepend(row);
            if (box.children.length > 50) box.lastChild.remove();
        }

        document.getElementById('clearLogsBtn').addEventListener('click', () => {
            const box = document.getElementById('logTableBody');
            if (!box || box.children.length < 2) { showToast.fire({icon:'info',title:'Tidak ada log'}); return; }
            confirmAction('Clear Logs', 'Hapus semua log?', () => {
                box.innerHTML = '<div class="empty-state"><i data-lucide="terminal"></i><div>Belum ada log.</div></div>';
                safeIcons();
                showToast.fire({icon:'success',title:'Logs cleared'});
            });
        });

        function truncate(t, n) { return t.length <= n ? t : t.substring(0, n-3) + '...'; }

        // init
        const parts = window.location.pathname.split('/');
        currentAuthToken = parts[parts.length - 1];
        if (!currentAuthToken) {
            notify('error', 'Invalid Auth Token');
            setTimeout(() => window.location.href = '/', 1500);
        } else {
            loadConfigs();
        }
    });
    safeIcons();
</script>
</body>
</html>
